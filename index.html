<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Handmade celebration cakes and cupcakes in Kent by Flis. Birthdays, christenings and milestones, made to order.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flis's Cakes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
</head>
<body>
<style id="css">
/* Layout: a baker's order ticket. Photo-led gallery, handwritten labels, one big pull-quote. Owner edits in place. */
:root{
  --bg:#fffafb; --paper:#ffffff; --ink:#1d1f3a; --muted:#5d5a72;
  --pink:#d63d74; --pink-soft:#fbe3ec; --gold:#a97c22; --gold-soft:#f6ecd6;
  --navy-soft:#e6e8f3; --line:#ecdde3; --ok:#2f7d4f;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14152a; --paper:#1c1d36; --ink:#f7eef2; --muted:#b5afc4;
  --pink:#f2709c; --pink-soft:#3a2238; --gold:#dcb45e; --gold-soft:#332c22;
  --navy-soft:#252846; --line:#2e2f4d; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14152a; --paper:#1c1d36; --ink:#f7eef2; --muted:#b5afc4;
  --pink:#f2709c; --pink-soft:#3a2238; --gold:#dcb45e; --gold-soft:#332c22;
  --navy-soft:#252846; --line:#2e2f4d; --ok:#6fcf97; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:4px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{font-family:var(--hand);font-size:2rem;font-weight:700;color:var(--pink);text-decoration:none;line-height:1}
nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header nav a{text-decoration:none;font-weight:500;font-size:.95rem}
header nav a:hover{color:var(--pink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 .95rem var(--body);text-decoration:none;padding:12px 22px;border-radius:999px;background:var(--pink);color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.small{padding:8px 16px;font-size:.88rem}
nav .btn{padding:8px 16px}
@media (max-width:620px){header nav a:not(.btn){display:none}}

.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:56px 64px}
.hero > *{min-width:0}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{color:var(--muted);max-width:46ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stack{position:relative;aspect-ratio:1/1.08;max-width:100%}
.stack .tile{position:absolute;width:50%;box-shadow:0 18px 40px -18px rgba(29,31,58,.45);border:8px solid var(--paper);border-radius:6px}
.stack .t1{left:0;top:3%;transform:rotate(-5deg)}
.stack .t2{right:0;top:0;transform:rotate(4deg);width:46%}
.stack .t3{left:26%;bottom:0;transform:rotate(1.5deg);width:48%}
.sticker{position:absolute;right:2%;bottom:6%;background:var(--gold);color:var(--paper);font-family:var(--hand);font-size:1.4rem;line-height:1.05;text-align:center;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;transform:rotate(10deg);padding:10px}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:36px;padding-block:36px 48px}.stack{max-width:440px;width:100%;margin:0 auto}}

.photo{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:4px;max-width:100%;background:var(--pink-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

section{padding-block:72px}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(2rem,4vw,3rem);margin-top:8px}
.head p{color:var(--muted);max-width:44ch;margin:8px 0 0}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:500 .9rem var(--body);padding:7px 15px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{margin:0;min-width:0;position:relative}
.card .zoom{all:unset;display:block;cursor:zoom-in;border-radius:4px}
.card .zoom:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.card .photo img{transition:transform .35s ease}
.card .zoom:hover .photo img{transform:scale(1.04)}
.card figcaption{padding-top:10px}
.card .t{font-weight:600;font-size:.98rem;line-height:1.3}
.card .o{color:var(--muted);font-size:.86rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:6px}

dialog{border:0;padding:0;background:transparent;max-width:min(92vw,560px);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(20,21,42,.82)}
.lb{margin:0;background:var(--paper);border-radius:6px;overflow:hidden}
.lb img{display:block;width:100%;height:auto}
.lb figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.lb .t{font-weight:600}.lb .o{color:var(--muted);font-size:.9rem}
.pill{border:0;background:var(--pink-soft);color:var(--ink);font:600 .9rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;flex-shrink:0}

.kind{background:var(--ink);color:var(--bg)}
.feature{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;margin:20px 0 48px}
.feature .mark{font-family:var(--display);font-size:8rem;line-height:.7;color:var(--pink)}
.feature blockquote{margin:0;font-family:var(--display);font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.25;max-width:30ch;text-wrap:balance}
.who{font-family:var(--hand);font-size:1.5rem;color:var(--gold);margin-top:14px;display:block}
.quotes{columns:3 260px;column-gap:20px}
.q{break-inside:avoid;margin:0 0 20px;padding:22px 22px 18px;border:1px solid color-mix(in srgb,var(--bg) 20%,transparent);border-radius:4px}
.q p{margin:0;font-size:1.05rem}
.q .who{font-size:1.3rem;margin-top:8px}
@media (max-width:620px){.feature{grid-template-columns:1fr;gap:8px}.feature .mark{font-size:5rem}}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.menu > div{min-width:0}
.ticket{background:var(--paper);border:1px solid var(--line);padding:28px;border-radius:4px}
.ticket h3{font-size:1.6rem;margin-bottom:14px}
.ticket ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticket li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.ticket li span:last-child{color:var(--muted);text-align:right}
.size{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.note{font-family:var(--hand);font-size:1.35rem;color:var(--pink);margin-top:16px}
@media (max-width:760px){.menu{grid-template-columns:1fr}}

.order{background:var(--pink-soft)}
.order-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.order-grid > *{min-width:0}
.order h2{font-size:clamp(2rem,4vw,3rem);margin:8px 0 16px}
.order p{color:var(--muted)}
.steps{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-weight:700}
.form{background:var(--paper);padding:28px;border-radius:4px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:grid;gap:6px;font-size:.88rem;font-weight:600}
input,select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
.out{grid-column:1/-1;background:var(--bg);border:1.5px dashed var(--pink);border-radius:4px;padding:16px}
.out pre{white-space:pre-wrap;font:400 .95rem/1.5 var(--body);margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.88rem;color:var(--muted)}
@media (max-width:820px){.order-grid{grid-template-columns:1fr;gap:28px}}
@media (max-width:520px){.form{grid-template-columns:1fr;padding:20px}}

.contact{margin-top:32px;background:var(--paper);border-radius:4px;padding:24px}
.contact h3{font-size:1.5rem;margin-bottom:12px}
.contact dl{margin:0;display:grid;gap:12px}
.contact dl > div{display:grid;gap:2px;min-width:0}
.contact dt{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.contact dd{margin:0;font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.contact a{text-decoration-color:var(--pink);text-underline-offset:3px}
.contact a:hover{color:var(--pink)}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 18px}
.out .status{margin:12px 0 0}
footer{padding-block:40px;border-top:1px solid var(--line)}
section{scroll-margin-top:0px}
#contact{scroll-margin-top:90px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.float-nav{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));display:flex;gap:2px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 12px 30px -12px rgba(29,31,58,.55);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;align-items:center;width:max-content}
.float-nav::-webkit-scrollbar{display:none}
.float-nav a{flex:0 0 auto;text-decoration:none;color:var(--bg);font:600 .88rem var(--body);padding:9px 14px;border-radius:999px;transition:background .2s,color .2s;white-space:nowrap}
.float-nav a:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.float-nav a[aria-current="true"]{background:var(--pink);color:#fff}
@media (max-width:420px){.float-nav a{padding:9px 10px;font-size:.84rem}}
body.editing .float-nav{display:none}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.92rem}

/* ---- owner editing ---- */
.edit-fab{position:fixed;z-index:20;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 30px -10px rgba(29,31,58,.6)}
.editbar{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--pink);box-shadow:0 -10px 30px -12px rgba(29,31,58,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:12px}
.editbar .msg{font-size:.9rem;color:var(--muted);flex:1 1 200px;min-width:0}
.editbar .msg b{color:var(--ink)}
body.editing{padding-bottom:140px}
.tools{display:none;position:absolute;top:8px;left:8px;right:8px;gap:6px;justify-content:space-between;z-index:2}
body.editing .tools{display:flex}
.tool{border:0;cursor:pointer;font:600 .8rem var(--body);padding:7px 11px;border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.tool.del{background:var(--pink);color:#fff}
.q, .feature{position:relative}
.q .tools, .feature .tools{position:static;margin-top:12px;justify-content:flex-start}
.feature .tools{grid-column:1/-1}
.sheet{background:var(--paper);border-radius:8px;padding:24px;display:grid;gap:16px}
.sheet h3{font-size:1.7rem}
.sheet p{margin:0;color:var(--muted);font-size:.95rem}
.drop{position:relative;display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--pink);border-radius:6px;padding:20px;cursor:pointer;background:var(--pink-soft);font-weight:600}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop img{max-width:180px;border-radius:4px;display:block}
.err{color:var(--pink);font-size:.9rem;font-weight:600;margin:0}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}.card .photo img{transition:none}.card .zoom:hover .photo img{transform:none}}
</style>
<template id="markup">
<header>
  <div class="wrap bar">
    <a class="logo" href="#top">flis's cakes</a>
    <nav aria-label="Main">
      <a href="#cakes">Cakes</a>
      <a href="#kind-words">Kind words</a>
      <a href="#flavours">Flavours</a>
      <a href="#contact">Contact</a>
      <a class="btn" href="#order">Order a cake</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div>
      <span class="eyebrow">Handmade celebration cakes &middot; Kent</span>
      <h1>Cakes people <em>talk about</em> long after the party.</h1>
      <p>Flis bakes and hand-decorates celebration cakes and cupcakes to order: birthdays, baby showers, milestones and everything in between. Tell her the idea, and she'll make it real, right down to the little sugar figures.</p>
      <div class="cta">
        <a class="btn" href="#order">Ask about your date</a>
        <a class="btn ghost" href="#cakes">See the cakes</a>
      </div>
    </div>
    <div class="stack" id="stack" aria-label="A few of Flis's cakes"></div>
  </div>

  <section id="cakes">
    <div class="wrap">
      <div class="head">
        <div>
          <span class="eyebrow">Recent bakes</span>
          <h2>From the cake board</h2>
          <p>Every one made to order. Tap a cake for a closer look.</p>
        </div>
        <div class="chips" role="group" aria-label="Filter cakes" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="kind" id="kind-words">
    <div class="wrap">
      <span class="eyebrow">Kind words</span>
      <div id="featured"></div>
      <div class="quotes" id="quotes"></div>
    </div>
  </section>

  <section id="flavours">
    <div class="wrap">
      <div class="head">
        <div>
          <span class="eyebrow">What's inside</span>
          <h2>Flavours &amp; sizes</h2>
          <p>Mix and match. Two-tier cakes can have a different flavour on each tier.</p>
        </div>
      </div>
      <div class="menu">
        <div class="ticket">
          <h3>Sponges</h3>
          <ul>
            <li><span>Vanilla</span><span>with strawberry jam</span></li>
            <li><span>Chocolate fudge</span><span>rich and dense</span></li>
            <li><span>Lemon</span><span>zesty lemon buttercream</span></li>
            <li><span>Red velvet</span><span>great with summer berries</span></li>
            <li><span>Coffee</span><span>chocolate decorations</span></li>
            <li><span>Coconut</span><span>lovely on a tier</span></li>
            <li><span>Rich fruit</span><span>Christmas &amp; milestones</span></li>
          </ul>
        </div>
        <div class="ticket">
          <h3>Sizes</h3>
          <ul>
            <li><span class="size">6&Prime;</span><span>small gatherings</span></li>
            <li><span class="size">8&Prime;</span><span>most birthday parties</span></li>
            <li><span class="size">10&Prime;</span><span>big parties</span></li>
            <li><span class="size">2 tier +</span><span>milestones &amp; showpieces</span></li>
            <li><span class="size">Cupcakes</span><span>boxes &amp; towers</span></li>
          </ul>
          <p class="note">Got your own topper? Flis can leave space for it.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="order" id="order">
    <div class="wrap order-grid">
      <div>
        <span class="eyebrow">Order a cake</span>
        <h2>Tell Flis about your celebration</h2>
        <p>Fill in the details and your enquiry is ready to send to Flis by WhatsApp or email. Popular weekends go quickly, so it pays to ask early.</p>
        <ul class="steps">
          <li><b>1</b><span>Share the date, the occasion and your idea.</span></li>
          <li><b>2</b><span>Flis confirms she's free and talks through design, size and price.</span></li>
          <li><b>3</b><span>Collect your cake, ready for the big day.</span></li>
        </ul>
        <div class="contact" id="contact">
          <h3>Get in touch</h3>
          <dl>
            <div><dt>Phone or WhatsApp</dt><dd><a href="tel:+447961150980">07961 150980</a></dd></div>
            <div><dt>Email</dt><dd><a href="mailto:flis33@hotmail.com">flis33@hotmail.com</a></dd></div>
            <div><dt>Facebook</dt><dd><a href="https://www.facebook.com/share/1Du8HNVNDv/" target="_blank" rel="noopener">Flis's Cakes</a></dd></div>
            <div><dt>Instagram</dt><dd><a href="https://www.instagram.com/flisgaynor/" target="_blank" rel="noopener">@flisgaynor</a></dd></div>
          </dl>
        </div>
      </div>
      <form class="form" id="f" novalidate>
        <label>Your name<input id="name" required autocomplete="name"></label>
        <label>Date needed<input id="date" type="date" required></label>
        <label>Occasion
          <select id="occasion">
            <option>Birthday</option><option>Child's birthday</option><option>Wedding</option>
            <option>Baby shower</option><option>Anniversary</option><option>Christmas</option><option>Something else</option>
          </select>
        </label>
        <label>Size
          <select id="size">
            <option>Not sure yet</option><option>6" cake</option><option>8" cake</option><option>10" cake</option>
            <option>Two tiers or more</option><option>Cupcakes</option>
          </select>
        </label>
        <label class="full">Flavour
          <select id="flavour">
            <option>Not sure yet</option><option>Vanilla</option><option>Chocolate fudge</option><option>Lemon</option>
            <option>Red velvet</option><option>Coffee</option><option>Coconut</option><option>Rich fruit</option>
          </select>
        </label>
        <label class="full">Your idea<textarea id="idea" placeholder="Theme, colours, names, age, number of guests..."></textarea></label>
        <div class="full"><button class="btn" type="submit">Prepare my message</button></div>
        <div class="out" id="out" hidden>
          <pre id="msg"></pre>
          <div class="row">
            <a class="btn" id="sendWa" href="https://wa.me/447961150980" target="_blank" rel="noopener">Send on WhatsApp</a>
            <a class="btn ghost" id="sendMail" href="mailto:flis33@hotmail.com">Send by email</a>
            <button class="btn ghost" type="button" id="copy">Copy message</button>
          </div>
          <p class="status" id="status" aria-live="polite">If a button doesn't open anything, copy the message and send it to 07961 150980 or flis33@hotmail.com.</p>
        </div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span class="logo" style="font-size:1.7rem">flis's cakes</span>
    <span>Handmade in Kent &middot; Collection by arrangement</span>
    <span class="foot-links"><a href="tel:+447961150980">07961 150980</a><a href="mailto:flis33@hotmail.com">flis33@hotmail.com</a><a href="https://www.facebook.com/share/1Du8HNVNDv/" target="_blank" rel="noopener">Facebook</a><a href="https://www.instagram.com/flisgaynor/" target="_blank" rel="noopener">Instagram</a></span>
  </div>
</footer>

<dialog id="lb" aria-label="Cake photo">
  <figure class="lb">
    <img id="lbImg" alt="">
    <figcaption><div><div class="t" id="lbT"></div><div class="o" id="lbO"></div></div><button type="button" class="pill" id="lbClose">Close</button></figcaption>

ank you so much.", "w": "Sian, wedding cupcake tower"}, {"q": "They were perfect. Thank you!", "w": "Sharon, Chelsea cupcakes"}, {"q": "Thank you Flis, the cake was so nice.", "w": "Tracy, 60th birthday cake"}]}</script>
<script id="app-js">
const APP_SRC = document.currentScript.textContent;
const CSS = document.getElementById('css').textContent;
const MARKUP = document.getElementById('markup').innerHTML;
const HEAD_BITS = '<title>Flis\'s Cakes</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">';
const SAVED = JSON.parse(document.getElementById('state').textContent);
let draft = JSON.parse(JSON.stringify(SAVED));
const CATS = {kids:"Kids' parties", grown:"Teens & grown-ups", other:"Cupcakes & other"};
let filter = 'all', editing = false;

document.getElementById('app').appendChild(document.getElementById('markup').content.cloneNode(true));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const dirty = () => JSON.stringify(draft) !== JSON.stringify(SAVED);

function render(){
  const cakes = draft.cakes;
  $('stack').innerHTML = cakes.slice(0,3).map((c,i) =>
    `<div class="tile t${i+1}"><div class="photo"><img src="${c.img}" alt="${esc(c.t)}"></div></div>`).join('') +
    '<div class="sticker">Made to order</div>';

  const present = Object.keys(CATS).filter(k => cakes.some(c => c.c === k));
  if (filter !== 'all' && !present.includes(filter)) filter = 'all';
  $('chips').innerHTML = (present.length > 1 ? ['all', ...present] : []).map(k =>
    `<button class="chip" type="button" data-f="${k}" aria-pressed="${k===filter}">${k==='all'?'All':esc(CATS[k])}</button>`).join('');

  const shown = cakes.map((c,i) => ({c,i})).filter(x => filter==='all' || x.c.c===filter);
  $('grid').innerHTML = shown.length ? shown.map(({c,i}) => `<figure class="card">
      <div class="tools"><button class="tool" type="button" data-act="cake-front" data-i="${i}">Move to front</button><button class="tool del" type="button" data-act="cake-del" data-i="${i}">Remove</button></div>
      <button class="zoom" type="button" data-act="zoom" data-i="${i}" aria-label="Enlarge ${esc(c.t)}"><div class="photo"><img src="${c.img}" alt="${esc(c.t)}${c.o?', '+esc(c.o):''}" loading="lazy" width="640" height="800"></div></button>
      <figcaption><div class="t">${esc(c.t)}</div>${c.o?`<div class="o">${esc(c.o)}</div>`:''}</figcaption></figure>`).join('')
    : '<div class="empty">No cakes here yet.</div>';

  const qs = draft.quotes;
  $('kind-words').hidden = !qs.length && !editing;
  const qtools = i => `<div class="tools">${i>0?`<button class="tool" type="button" data-act="q-top" data-i="${i}">Make this the big quote</button>`:''}<button class="tool del" type="button" data-act="q-del" data-i="${i}">Remove</button></div>`;
  $('featured').innerHTML = qs.length ? `<div class="feature"><div class="mark" aria-hidden="true">&ldquo;</div><div><blockquote>${esc(qs[0].q)}</blockquote><span class="who">${esc(qs[0].w)}</span></div>${qtools(0)}</div>`
    : '<p class="empty" style="margin-top:20px">No kind words yet. Add one with the button below.</p>';
  $('quotes').innerHTML = qs.slice(1).map((x,j) => `<figure class="q"><p>&ldquo;${esc(x.q)}&rdquo;</p><span class="who">${esc(x.w)}</span>${qtools(j+1)}</figure>`).join('');

  const n = dirty();
  $('saveBtn').disabled = !n;
  $('discardBtn').disabled = !n;
  setActive();
  if (editing && !saving) $('editMsg').innerHTML = n ? '<b>You have unsaved changes.</b> Press Save to put them on the website.' : 'Use the buttons on each photo or quote to move or remove it.';
}
let saving = false;

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-f]'); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; render(); return; }
  const i = +b.dataset.i, act = b.dataset.act;
  if (act === 'zoom') {
    const c = draft.cakes[i];
    $('lbImg').src = c.img; $('lbImg').alt = c.t; $('lbT').textContent = c.t; $('lbO').textContent = c.o || '';
    openDlg($('lb')); return;
  }
  if (act === 'cake-front') draft.cakes.unshift(draft.cakes.splice(i,1)[0]);
  if (act === 'cake-del') draft.cakes.splice(i,1);
  if (act === 'q-top') draft.quotes.unshift(draft.quotes.splice(i,1)[0]);
  if (act === 'q-del') draft.quotes.splice(i,1);
  render();
});
function openDlg(d){ try { d.showModal(); } catch (err) { d.setAttribute('open',''); } }
$('lbClose').onclick = () => $('lb').close();
$('lb').addEventListener('click', e => { if (e.target === $('lb')) $('lb').close(); });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* ---- floating section menu ---- */
const navLinks = [...document.querySelectorAll('#floatNav a, header nav a')];
const fLinks = [...document.querySelectorAll('#floatNav a')];
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
navLinks.forEach(a => a.addEventListener('click', e => {
  const t = document.querySelector(a.getAttribute('href')); if (!t) return;
  e.preventDefault(); t.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'});
}));
let navTick = false;
function setActive(){
  navTick = false;
  const line = innerHeight * 0.35; let cur = -1;
  fLinks.forEach((a, i) => {
    const t = document.querySelector(a.getAttribute('href'));
    a.hidden = !t || !!t.closest('[hidden]');
    if (t && !a.hidden && t.getBoundingClientRect().top <= line) cur = i;
  });
  fLinks.forEach((a, i) => a.setAttribute('aria-current', i === cur ? 'true' : 'false'));
  const on = fLinks[cur]; if (on) { const n = $('floatNav'); const l = on.offsetLeft, r = l + on.offsetWidth; if (l < n.scrollLeft || r > n.scrollLeft + n.clientWidth) n.scrollLeft = l - 8; }
}
addEventListener('scroll', () => { if (!navTick) { navTick = true; requestAnimationFrame(setActive); } }, {passive: true});
addEventListener('resize', setActive);

/* ---- order form ---- */
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  $('out').hidden = false;
  if (!v('name') || !v('date')) { $('msg').textContent = 'Please add your name and the date you need the cake, then try again.'; $('status').textContent=''; return; }
  const d = new Date(v('date') + 'T12:00');
  const nice = isNaN(d) ? v('date') : d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  $('msg').textContent = `Hi Flis! I'd love to order a cake.\n\nName: ${v('name')}\nDate: ${nice}\nOccasion: ${v('occasion')}\nSize: ${v('size')}\nFlavour: ${v('flavour')}` + (v('idea') ? `\nMy idea: ${v('idea')}` : '');
  const body = $('msg').textContent;
  $('sendWa').href = 'https://wa.me/447961150980?text=' + encodeURIComponent(body);
  $('sendMail').href = 'mailto:flis33@hotmail.com?subject=' + encodeURIComponent('Cake enquiry from ' + v('name')) + '&body=' + encodeURIComponent(body);
  $('status').textContent = "If a button doesn't open anything, copy the message and send it to 07961 150980 or flis33@hotmail.com.";
});
$('copy').addEventListener('click', () => {
  const pre = $('msg'), st = $('status');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = 'Message selected. Copy it, then paste it into WhatsApp, a text or an email to Flis.'; };
  try { navigator.clipboard.writeText(pre.textContent).then(() => st.textContent = 'Copied. Now paste it into WhatsApp, a text or an email to Flis.', fallback); } catch (err) { fallback(); }
});

/* ---- owner editing ---- */
let newPhoto = null;
async function processPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const W = 640, H = 800, r = W / H;
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; }
    else { const nh = sw / r; sy = (sh - nh) * 0.35; sh = nh; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    let d = c.toDataURL('image/webp', 0.74);
    if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.8);
    return d;
  } finally { URL.revokeObjectURL(url); }
}
function showErr(id, t){ $(id).textContent = t; $(id).hidden = !t; }

$('cakeFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  showErr('cakeErr',''); $('dropTxt').textContent = 'Preparing photo...';
  try { newPhoto = await processPhoto(f); $('cakePrev').src = newPhoto; $('cakePrev').hidden = false; $('dropTxt').textContent = 'Tap to choose a different photo'; }
  catch (err) { newPhoto = null; $('cakePrev').hidden = true; $('dropTxt').textContent = 'Tap to choose a photo'; showErr('cakeErr', "That photo couldn't be opened. Try a JPG or PNG, or take a screenshot of it and use that."); }
});
$('addCakeBtn').onclick = () => {
  newPhoto = null; $('cakeForm').reset(); $('cakePrev').hidden = true; $('dropTxt').textContent = 'Tap to choose a photo'; showErr('cakeErr','');
  openDlg($('cakeDlg'));
};
$('cakeForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!newPhoto) return showErr('cakeErr', 'Choose a photo first.');
  const t = $('cakeT').value.trim();
  if (!t) return showErr('cakeErr', 'Give the cake a short name, like "Fire engine cake".');
  draft.cakes.unshift({t, o: $('cakeO').value.trim(), c: $('cakeC').value, img: newPhoto});
  filter = 'all'; $('cakeDlg').close(); render();
  $('cakes').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
$('addQuoteBtn').onclick = () => { $('quoteForm').reset(); showErr('quoteErr',''); openDlg($('quoteDlg')); };
$('quoteForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('quoteQ').value.trim().replace(/^["“]|["”]$/g, ''), n = $('quoteN').value.trim(), c = $('quoteC').value.trim();
  if (!q) return showErr('quoteErr', 'Add what the customer said.');
  if (!n) return showErr('quoteErr', "Add the customer's first name.");
  draft.quotes.splice(Math.min(1, draft.quotes.length), 0, {q, w: c ? `${n}, ${c}` : n});
  $('quoteDlg').close(); render();
  $('kind-words').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});

function setEditing(on){
  editing = on; document.body.classList.toggle('editing', on);
  $('editbar').hidden = !on; $('editBtn').hidden = on || !canEdit;
  render();
}
let canEdit = false;
$('editBtn').onclick = () => setEditing(true);
$('doneBtn').onclick = () => setEditing(false);
$('discardBtn').onclick = () => { draft = JSON.parse(JSON.stringify(SAVED)); render(); };
window.addEventListener('beforeunload', e => { if (dirty() && !saving) { e.preventDefault(); e.returnValue = ''; } });

function resetCss(){
  const s = [...document.head.querySelectorAll('style')].find(x => x.textContent.includes('safe-area-inset'));
  return s ? s.textContent : ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
}
function buildDoc(state){
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss() + '</style></head><body>'
    + HEAD_BITS + '\n<style id="css">' + CSS + '</style>\n<template id="markup">' + MARKUP + '</template>\n<div id="app"></div>\n<script type="application/json" id="state">' + json + '<\/script>\n<script id="app-js">' + APP_SRC + '<\/script>\n</body></html>';
}
$('saveBtn').onclick = async () => {
  if (!dirty() || saving) return;
  saving = true; $('saveBtn').disabled = true; $('editMsg').innerHTML = '<b>Saving...</b> The page will refresh when it\'s done.';
  const fail = t => { saving = false; $('editMsg').innerHTML = '<b>' + t + '</b>'; $('saveBtn').disabled = !dirty(); };
  try {
    const artifact = window.claude ? await window.claude.use('artifact') : null;
    if (!artifact) return fail("Saving isn't available here. Open the site in Claude while signed in to edit it.");
    await artifact.publish(buildDoc(draft));
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') { saving = true; $('editMsg').innerHTML = '<b>Someone else saved at the same moment.</b> The page is refreshing with their version; please make your changes again.'; return; }
    if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed' || code === 'not_declared') { canEdit = false; return fail("You can view this site but not edit it. Ask the owner for edit access."); }
    if (code === 'too_large') return fail('The site is full. Remove a few older photos, then save again.');
    if (code === 'rate_limited') return fail('Saving too often. Wait a minute, then press Save again.');
    return fail("That didn't save. Check your connection and press Save again.");
  }
};

render();
(async () => {
  if (!window.claude || !window.claude.use) return;
  const user = await window.claude.use('user');
  canEdit = user ? await user.canEdit() : false;
  if (canEdit) $('editBtn').hidden = false;
})();
</script>
